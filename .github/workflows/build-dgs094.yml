name: Build DGS 0.9.4
on:
  push:
    branches: [dragon-game-studio-0.9.4-build]
    paths:
      - dgs094-source.zip.b64
      - ci-build-dgs094.sh
      - .github/workflows/build-dgs094.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bash ci-build-dgs094.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DragonGameStudio-0.9.4-original-signature
          path: dgs094/DragonGameStudio-0.9.4-debug.apk
          if-no-files-found: error
          retention-days: 7
