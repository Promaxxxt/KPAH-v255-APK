name: Build KPAH Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'KPAHtuoitho_drg.jar'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout KPAH project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;22.1.7171670"

      - name: Clone standalone runtime
        run: |
          git clone https://github.com/nikita36078/J2ME-Loader.git runtime
          cd runtime
          git checkout 9b0fa48a0a0d1e61376c0b9af28b3d2caec0a4cc

      - name: Generate local signing config
        run: |
          keytool -genkeypair -v \
            -keystore runtime/kpah-build.keystore \
            -storepass android -keypass android \
            -alias kpah -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KPAHvip,O=KPAH,C=VN"
          cat > runtime/keystore.properties <<'EOF'
          storeFile=kpah-build.keystore
          storePassword=android
          keyAlias=kpah
          keyPassword=android
          EOF

      - name: Prepare KPAH standalone port
        run: |
          python3 scripts/prepare_port.py runtime "$GITHUB_WORKSPACE/KPAHtuoitho_drg.jar"

      - name: Apply dex-safe bytecode patches
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import zipfile
          from pathlib import Path

          jar = Path('runtime/app/libs/KPAH.jar')
          patch_dir = Path('patches')
          targets = {
              'offline/fix/ArcherPoisonMonsterFix.class': 'offline__fix__ArcherPoisonMonsterFix.class.b64',
              'offline/fix/ArcherPoisonTickSync.class': 'offline__fix__ArcherPoisonTickSync.class.b64',
              'offline/persistence/player/MemoryPlayerStore.class': 'offline__persistence__player__MemoryPlayerStore.class.b64',
              'offline/persistence/rms/RmsPlayerStore.class': 'offline__persistence__rms__RmsPlayerStore.class.b64',
          }

          replacements = {
              name: base64.b64decode((patch_dir / filename).read_text(encoding='ascii').strip())
              for name, filename in targets.items()
          }

          tmp = jar.with_suffix('.patched.jar')
          replaced = set()
          with zipfile.ZipFile(jar, 'r') as zin, zipfile.ZipFile(tmp, 'w') as zout:
              for info in zin.infolist():
                  if info.filename in replacements:
                      zout.writestr(info, replacements[info.filename])
                      replaced.add(info.filename)
                  else:
                      zout.writestr(info, zin.read(info.filename))

          missing = set(replacements) - replaced
          if missing:
              raise SystemExit('Patch targets missing from JAR: ' + ', '.join(sorted(missing)))

          tmp.replace(jar)
          print('Patched dex-safe classes:')
          for name in sorted(replaced):
              print(' -', name, len(replacements[name]), 'bytes')
          PY

      - name: Build standalone APK
        working-directory: runtime
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleMidletDebug --stacktrace --no-daemon 2>&1 | tee ../build-output.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 500 ../build-output.log > ../BUILD_ERROR.txt
            exit "$code"
          fi

      - name: Save build error for diagnosis
        if: failure()
        run: |
          if [ -f BUILD_ERROR.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BUILD_ERROR.txt
            git commit -m "Capture APK build error" || true
            git push || true
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find runtime/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" output/KPAHvip_v1.6.255_FULL_STANDALONE.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPAHvip-v1.6.255-FULL-STANDALONE
          path: output/KPAHvip_v1.6.255_FULL_STANDALONE.apk
          if-no-files-found: error
          retention-days: 30
