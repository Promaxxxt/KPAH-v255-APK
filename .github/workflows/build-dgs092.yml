name: Build DGS 0.9.2
on:
  push:
    branches: [dragon-game-studio-0.9.2-build]
    paths:
      - dgs092-source.zip.b64
      - ci-build-dgs092.sh
      - .github/workflows/build-dgs092.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bash ci-build-dgs092.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DragonGameStudio-0.9.2-original-signature
          path: dgs092/DragonGameStudio-0.9.2-debug.apk
          if-no-files-found: error
          retention-days: 7
