name: Build Dragon Game Studio 0.8 APK

on:
  push:
    branches:
      - dragon-game-studio-0.8-build
    paths:
      - dgs08-source.tar.gz.b64
      - .github/workflows/build-dgs05.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Dragon Game Studio 0.8 source
        run: |
          set -euxo pipefail
          rm -rf dgs08
          mkdir -p dgs08
          base64 --decode dgs08-source.tar.gz.b64 | tar -xz -C dgs08
          test -f dgs08/src/com/dragon9x/gamestudio/GameCodeBundle.java
          test -f dgs08/HUONG_DAN_CODE_GAME_0.8.txt
          grep -q 'android:versionCode="8"' dgs08/AndroidManifest.xml
          grep -q 'android:versionName="0.8"' dgs08/AndroidManifest.xml
          keytool -list -v -keystore dgs08/debug.keystore -storepass android -alias dragon-debug | grep 'D2:46:7E:6E:D5:B4:B8:15:C6:05:C8:67:06:60:E2:87:49:4C:8E:85:56:F9:3F:24:93:2C:B7:57:17:F3:0E:93'

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cd dgs08
          chmod +x BUILD_APK.sh
          ANDROID_SDK_ROOT="$SDK" \
          ANDROID_BUILD_TOOLS="$SDK/build-tools/34.0.0" \
          ANDROID_PLATFORM_JAR="$SDK/platforms/android-34/android.jar" \
          ./BUILD_APK.sh
          test -s DragonGameStudio-0.8-debug.apk
          "$SDK/build-tools/34.0.0/apksigner" verify --verbose --print-certs DragonGameStudio-0.8-debug.apk | tee certs.txt
          grep -q 'd2467e6ed5b4b815c605c8670660e287494c8e8556f93f24932cb75717f30e93' certs.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonGameStudio-0.8-original-signature
          path: dgs08/DragonGameStudio-0.8-debug.apk
          if-no-files-found: error
          retention-days: 7
