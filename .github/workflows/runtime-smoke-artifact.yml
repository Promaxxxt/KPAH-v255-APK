name: Runtime Smoke Exact Artifact
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/runtime-smoke-artifact.yml'

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Download exact successful APK
        uses: actions/download-artifact@v4
        with:
          name: KPAHvip-v1.6.255-FULL-STANDALONE
          path: exact-apk
          repository: Promaxxxt/KPAH-v255-APK
          run-id: 34149767576
          github-token: ${{ github.token }}
      - name: Inspect exact APK
        run: |
          ls -lh exact-apk
          APK=$(find exact-apk -type f -name '*.apk' | head -n 1)
          unzip -l "$APK" | grep -E 'lib/(x86_64|x86|arm64-v8a|armeabi-v7a)/.*\.so' | head -n 20
      - name: Launch exact APK on Android 34 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK=$(find exact-apk -type f -name '*.apk' | head -n 1)
            echo '=== ABI ==='
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.product.cpu.abilist
            echo '=== INSTALL ==='
            adb install --no-streaming -r "$APK" || true
            adb shell pm list packages | grep kpahvip || true
            adb logcat -c
            echo '=== LAUNCH ==='
            adb shell am start -W -n com.example.androidlet.kpahvip.debug/javax.microedition.shell.MicroActivity || true
            sleep 12
            echo '=== PID ==='
            adb shell pidof com.example.androidlet.kpahvip.debug || true
            echo '=== RUNTIME ==='
            adb logcat -d -v threadtime | grep -E -A 120 -B 25 'FATAL EXCEPTION|AndroidRuntime|kpahvip|GameMidlet|MicroActivity|MicroLoader|Init midlet failed|ClassNotFoundException|NoClassDefFoundError|UnsatisfiedLinkError' | tail -n 800 || true
