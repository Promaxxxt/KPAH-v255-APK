name: Diagnose KPAH D8 Bytecode

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-d8.yml'
      - 'scripts/isolate_d8_bad_classes.py'
      - 'scripts/apply_dexsafe_patches.py'
      - 'patches/**'
      - 'KPAHtuoitho_drg.jar'

permissions:
  contents: write

concurrency:
  group: kpah-d8-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install D8
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build diagnostic JAR
        run: |
          python3 scripts/apply_dexsafe_patches.py \
            KPAHtuoitho_drg.jar \
            KPAH-diagnostic.jar

      - name: Isolate malformed classes
        run: |
          python3 scripts/isolate_d8_bad_classes.py \
            KPAH-diagnostic.jar \
            "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --output D8_BAD_CLASSES.txt
          cat D8_BAD_CLASSES.txt

      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add D8_BAD_CLASSES.txt
          git commit -m "Record D8 bad class diagnosis" || true
          git push || true
