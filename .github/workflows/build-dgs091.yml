name: Build DGS 0.9.1
on:
  push:
    branches: [dragon-game-studio-0.9.1-build]
    paths:
      - dgs091-source.tar.gz.b64
      - ci-build-dgs091.sh
      - .github/workflows/build-dgs091.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bash ci-build-dgs091.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DragonGameStudio-0.9.1-original-signature
          path: dgs091/DragonGameStudio-0.9.1-debug.apk
          if-no-files-found: error
          retention-days: 7
